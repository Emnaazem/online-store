<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باكاتي ستور - ملابس أطفال مستعملة</title>
<style>
:root{
  --pink:#f8b4c4; --blue:#a7d0e8; --cream:#fdf6ee; --navy:#2b3a55;
  --card:#ffffff; --bg:#fdf6ee; --txt:#2b3a55; --muted:#7a8699;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --card:#232b3d; --bg:#161c28; --txt:#f0e9e0; --muted:#9aa5b8; }
}
:root[data-theme="dark"]{ --card:#232b3d; --bg:#161c28; --txt:#f0e9e0; --muted:#9aa5b8; }
body{ margin:0; background:var(--bg); color:var(--txt); font-family:'Tahoma','Segoe UI',sans-serif; }
header{
  position:sticky; top:0; z-index:5;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
  background:linear-gradient(135deg,var(--pink),var(--blue));
  text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.08);
}
header h1{margin:0; font-size:1.5rem; color:#2b3a55;}
header p{margin:4px 0 0; font-size:.85rem; color:#3a4560;}
.badges{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:10px;}
.badges span{ background:rgba(255,255,255,.75); padding:4px 10px; border-radius:20px; font-size:.72rem; font-weight:bold; color:#2b3a55;}
main{max-width:900px; margin:0 auto; padding:18px 14px 40px;}
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
.card{ background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 3px 12px rgba(0,0,0,.08); display:flex; flex-direction:column; position:relative;}
.card img{width:100%; display:block; max-width:100%; aspect-ratio:4/5; object-fit:cover; background:#eee;}
.card-body{padding:12px 14px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
.card-body h3{margin:0; font-size:1rem;}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin:2px 0;}
.tags span{ background:var(--cream); color:var(--navy); font-size:.68rem; padding:3px 8px; border-radius:10px; border:1px solid rgba(0,0,0,.06);}
:root[data-theme="dark"] .tags span{background:#2f3a52;color:#f0e9e0;}
.price{font-weight:bold; color:#c0577a; font-size:.95rem; margin-top:auto;}
.order-btn{ margin-top:8px; text-decoration:none; text-align:center; background:#25D366; color:#fff; padding:10px; border-radius:10px; font-weight:bold; font-size:.85rem;}
footer{ text-align:center; padding:20px 14px calc(24px + env(safe-area-inset-bottom,0px)); color:var(--muted); font-size:.8rem;}
.wa-float{ position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:16px; background:#25D366; color:#fff; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:10;}
.admin-bar{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:12px; z-index:20; }
.admin-bar button{ background:var(--navy); color:#fff; border:none; border-radius:20px; padding:8px 14px; font-size:.8rem; box-shadow:0 3px 10px rgba(0,0,0,.2);}
.edit-icons{ position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:2;}
.edit-icons button{ background:rgba(255,255,255,.9); border:none; border-radius:8px; width:32px; height:32px; font-size:.95rem; box-shadow:0 2px 6px rgba(0,0,0,.2);}
.editform{ padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
.editform input, .editform textarea{ padding:8px; border-radius:8px; border:1px solid #ccc; font-family:inherit; font-size:.85rem; width:100%;}
.editform .row{display:flex; gap:8px;}
.editform .row button{flex:1; padding:9px; border:none; border-radius:8px; font-weight:bold; font-size:.85rem;}
.btn-save{background:var(--navy); color:#fff;}
.btn-cancel{background:#ddd; color:#333;}
.add-card{ border:2px dashed var(--muted); border-radius:16px; display:flex; align-items:center; justify-content:center; min-height:180px; cursor:pointer; color:var(--muted); font-weight:bold; background:transparent;}
.toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:20px; font-size:.85rem; z-index:30; opacity:0; transition:opacity .3s;}
.toast.show{opacity:1;}
</style>
</head>

<script id="waNumber" type="application/json">"21654012599"</script>

<script>
let products = JSON.parse(document.getElementById('productData').textContent);
let waNumber = JSON.parse(document.getElementById('waNumber').textContent);
let isAdmin = false;
let artifactApi = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function waLink(text){
  return 'https://wa.me/' + waNumber + '?text=' + encodeURIComponent(text);
}

function cardHTML(p, idx){
  const tagsHtml = (p.tags||[]).map(t=>`<span>${escapeHtml(t)}</span>`).join('');
  const editIcons = isAdmin ? `<div class="edit-icons">
      <button onclick="startEdit(${idx})" title="تعديل">✏️</button>
      <button onclick="deleteProduct(${idx})" title="حذف">🗑️</button>
    </div>` : '';
  return `<div class="card" id="card-${idx}">
    ${editIcons}
    <img src="${p.img}" alt="${escapeHtml(p.name)}">
    <div class="card-body" id="body-${idx}">
      <h3>${escapeHtml(p.name)}</h3>
      <div class="tags">${tagsHtml}</div>
      <div class="price">السعر: ${escapeHtml(p.price)}</div>
      <a class="order-btn" href="${waLink('مرحبا، نحب نطلب: ' + p.name)}" target="_blank">🛒 اطلب عبر واتساب</a>
    </div>
  </div>`;
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){
  const grid = document.getElementById('grid');
  let html = products.map((p,i)=>cardHTML(p,i)).join('');
  if(isAdmin){
    html += `<div class="add-card" onclick="startAdd()">➕ إضافة باك جديد</div>`;
  }
  grid.innerHTML = html;
  document.getElementById('waFloat').href = waLink('مرحبا، نحب نستفسر على الباكات');

  const bar = document.getElementById('adminBar');
  if(isAdmin){
    bar.style.display='block';
    bar.innerHTML = `<button onclick="editWaNumber()">📞 رقم واتساب: ${waNumber}</button>`;
  } else {
    bar.style.display='none';
  }
}

function startEdit(idx){
  const p = products[idx];
  document.getElementById('body-'+idx).innerHTML = `
    <div class="editform">
      <input id="f-name-${idx}" value="${escapeHtml(p.name)}" placeholder="اسم الباك">
      <input id="f-tags-${idx}" value="${escapeHtml((p.tags||[]).join('، '))}" placeholder="مواصفات مفصولة بفاصلة">
      <input id="f-price-${idx}" value="${escapeHtml(p.price)}" placeholder="السعر مثال: 45 د.ت">
      <div class="row">
        <button class="btn-save" onclick="saveEdit(${idx})">✔️ حفظ</button>
        <button class="btn-cancel" onclick="renderAll()">إلغاء</button>
      </div>
    </div>`;
}

function saveEdit(idx){
  products[idx].name = document.getElementById('f-name-'+idx).value.trim();
  products[idx].tags = document.getElementById('f-tags-'+idx).value.split('،').map(s=>s.trim()).filter(Boolean);
  products[idx].price = document.getElementById('f-price-'+idx).value.trim();
  renderAll();
  publishUpdate();
}

function deleteProduct(idx){
  if(!confirm('تأكيد حذف هذا الباك؟')) return;
  products.splice(idx,1);
  renderAll();
  publishUpdate();
}

function editWaNumber(){
  const n = prompt('رقم الواتساب الجديد (بصيغة 216XXXXXXXX):', waNumber);
  if(n && n.trim()){
    waNumber = n.trim();
    renderAll();
    publishUpdate();
  }
}

function startAdd(){
  const grid = document.getElementById('grid');
  const addCard = grid.querySelector('.add-card');
  addCard.outerHTML = `<div class="card">
    <div class="editform">
      <input id="new-name" placeholder="اسم الباك">
      <input id="new-tags" placeholder="مواصفات مفصولة بفاصلة، مثال: مقاس 2 سنين، حالة ممتازة">
      <input id="new-price" placeholder="السعر مثال: 45 د.ت">
      <p style="font-size:.75rem;color:var(--muted);margin:0;">📷 ملاحظة: الصورة توحطها بعدين — ابعت الصورة في الشات لـ Claude ويزيدهالك.</p>
      <div class="row">
        <button class="btn-save" onclick="saveAdd()">✔️ إضافة</button>
        <button class="btn-cancel" onclick="renderAll()">إلغاء</button>
      </div>
    </div>
  </div>`;
}

function resizeImage(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxSize){ h = h*maxSize/w; w = maxSize; }
      else if(h > maxSize){ w = w*maxSize/h; h = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveAdd(){
  const name = document.getElementById('new-name').value.trim();
  const tags = document.getElementById('new-tags').value.split('،').map(s=>s.trim()).filter(Boolean);
  const price = document.getElementById('new-price').value.trim() || 'تواصل معنا 💬';
  if(!name){ alert('لازم تحط اسم الباك'); return; }
  const placeholder = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#eee"/><text x="50%" y="50%" font-size="28" text-anchor="middle" fill="#999" font-family="sans-serif">📷</text></svg>');
  products.push({name, tags, price, img: placeholder});
  renderAll();
  publishUpdate();
}

async function publishUpdate(){
  if(!artifactApi) return;
  try{
    document.getElementById('productData').textContent = JSON.stringify(products);
    document.getElementById('waNumber').textContent = JSON.stringify(waNumber);
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('.editform').forEach(el=>el.closest('.card') && el.closest('.card').remove());
    const adminBarClone = clone.querySelector('#adminBar');
    if(adminBarClone) adminBarClone.remove();
    clone.querySelectorAll('.edit-icons').forEach(el=>el.remove());
    clone.querySelectorAll('.add-card').forEach(el=>el.remove());
    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    await artifactApi.publish(html);
    showToast('✅ تم الحفظ للجميع');
  } catch(e){
    showToast('⚠️ تعذر الحفظ، حاول مرة أخرى');
  }
}

async function initAdmin(){
  try{
    const user = await claude.use('user');
    const artifact = await claude.use('artifact');
    artifactApi = artifact;
    if(user && user.canEdit && user.canEdit()){
      isAdmin = true;
      renderAll();
    }
  } catch(e){}
}

renderAll();
if(window.claude){ initAdmin(); }
</script>

</body>
</html>
